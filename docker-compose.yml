name: carnet
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: carnet
      POSTGRES_PASSWORD: carnet
      POSTGRES_DB: carnet
    ports:
      # POSTGRES_PORT keeps parallel worktrees off each other's ports (5432 + PORT_OFFSET).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates carnet_migrator and carnet_app on a fresh volume (packages/db/sql/roles.sql).
      - ./packages/db/sql/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnet -d carnet"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: .
    # Optional .env (keys in .env.example): Airwallex, Anthropic, BETTER_AUTH_SECRET and the limits.
    # `environment` below wins over it, so the container always uses the compose Postgres and its mode.
    env_file:
      - path: .env
        required: false
    environment:
      PROCESS_MODE: web
      NODE_ENV: production
      DATABASE_URL: postgres://carnet_app:carnet_app@postgres:5432/carnet
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    # Optional .env (keys in .env.example): Airwallex, Anthropic, BETTER_AUTH_SECRET and the limits.
    # `environment` below wins over it, so the container always uses the compose Postgres and its mode.
    env_file:
      - path: .env
        required: false
    environment:
      PROCESS_MODE: worker
      NODE_ENV: production
      DATABASE_URL: postgres://carnet_app:carnet_app@postgres:5432/carnet
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
