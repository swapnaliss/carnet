# Render Blueprint (ADR 0014, ADR 0019, M1-06): one Docker image, two services, one Postgres. Singapore.
# Secrets are never in this file: `sync: false` keys are set in the dashboard or through the Render API
# (docs/deployment.md lists every key). Resource names are fixed: carnet-web, carnet-worker, carnet-db.
databases:
  - name: carnet-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
    databaseName: carnet
    user: carnet_admin
    diskSizeGB: 1
    ipAllowList: [] # internal connections only; open one IP only for the setup run, then empty it again

services:
  - type: web
    name: carnet-web
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/swapnaliss/carnet
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Release step: migrations as carnet_migrator. A non-zero exit fails the deploy; the previous
    # version keeps serving.
    preDeployCommand: node runtime/release.mjs
    autoDeployTrigger: checksPass # deploy each main commit after GitHub CI is green
    numInstances: 1
    envVars:
      - key: PROCESS_MODE
        value: web
      - key: NODE_ENV
        value: production
      - key: AIRWALLEX_BASE_URL
        value: https://api.sandbox.airwallex.com
      - key: AIRWALLEX_FILES_URL
        value: https://files.sandbox.airwallex.com
      - fromGroup: carnet-secrets

  - type: worker
    name: carnet-worker
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/swapnaliss/carnet
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: PROCESS_MODE
        value: worker
      - key: NODE_ENV
        value: production
      - key: AIRWALLEX_BASE_URL
        value: https://api.sandbox.airwallex.com
      - key: AIRWALLEX_FILES_URL
        value: https://files.sandbox.airwallex.com
      - fromGroup: carnet-secrets

envVarGroups:
  - name: carnet-secrets
    envVars:
      - key: DATABASE_URL # carnet_app on carnet-db (internal host)
        sync: false
      - key: DATABASE_MIGRATION_URL # carnet_migrator on carnet-db (internal host)
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET # generated by the setup, never printed
        sync: false
      - key: TRUSTED_PROXY_HOPS # Cloudflare + Render: 2 (measured 5 Nov 2026, docs/deployment.md)
        value: "2"
      - key: AIRWALLEX_CLIENT_ID
        sync: false
      - key: AIRWALLEX_API_KEY
        sync: false
      - key: AIRWALLEX_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_APPROVER_PASSWORD
        sync: false
      - key: SEED_JUDGE_PASSWORD
        sync: false
