name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carnet
          POSTGRES_PASSWORD: carnet
          POSTGRES_DB: carnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carnet -d carnet_test" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://carnet:carnet@localhost:5432/carnet_test
      # packages/db: app and migration roles created by packages/db/sql/roles.sql (synthetic, CI only)
      DATABASE_URL: postgres://carnet_app:carnet_app@localhost:5432/carnet_test
      DATABASE_MIGRATION_URL: postgres://carnet_migrator:carnet_migrator@localhost:5432/carnet_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: secret scan (tracked and staged files)
        run: ./scripts/check-no-secrets.sh
      # BL-01: workflow files were only YAML-parsed. rhysd/actionlint 1.7.7, pinned by digest.
      - name: workflow lint (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - name: dependency audit (npm audit --omit=dev --audit-level=high, minus .audit-allowlist.json)
        run: node scripts/audit-check.mjs
      - name: database roles (admin step, packages/db/sql/roles.sql)
        run: docker exec -i ${{ job.services.postgres.id }} psql -U carnet -d carnet_test -v ON_ERROR_STOP=1 < packages/db/sql/roles.sql
      - name: biome and dependency direction
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: next build
        run: npm run build
      # Accessibility (axe), Core Web Vitals budgets and the CSP check run on the production build
      # (playwright.config.ts starts `next start` on port 3000). BL-01: M1-07's checks were local only.
      - name: playwright browsers
        run: npx playwright install --with-deps chromium
      # /ops e2e (M1-09) signs in as the seeded users: credentials are random per run, masked, and
      # exist only in this job (no repository secret).
      - name: e2e credentials (generated per run)
        run: |
          for key in SEED_OWNER_PASSWORD SEED_APPROVER_PASSWORD SEED_JUDGE_PASSWORD BETTER_AUTH_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo "BETTER_AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
      - name: e2e database (migrate and seed the demo users)
        run: |
          npm run db:migrate -w packages/db
          npx tsx packages/db/src/seed/run.ts
      - name: playwright (axe, web vitals, CSP, /ops roles)
        run: npx playwright test
      - name: landing checks
        run: ./scripts/landing-checks.sh
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build (no push)
        run: docker build -t carnet-ci .
